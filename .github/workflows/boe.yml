name: Vigencia en el BOE

# Cada lunes comprueba contra la API del BOE que todas las normas citadas
# siguen vigentes y que los artículos enlazados existen. Si todo está bien,
# actualiza la fecha de verificación; si no, abre una incidencia.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar referencias
        id: verificar
        run: |
          set +e
          python scripts/verificar_boe.py | tee informe.txt
          echo "codigo=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Guardar la nueva fecha de verificación
        if: steps.verificar.outputs.codigo == '0'
        run: |
          python scripts/build_data.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verificacion_boe.json web extension
          git diff --cached --quiet || git commit -m "Verificación semanal de referencias contra el BOE"
          git push
      - name: Abrir incidencia
        if: steps.verificar.outputs.codigo != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Referencias legales con incidencias ($(date +%F))" \
            --body "$(printf 'La verificación semanal contra el BOE ha detectado incidencias:\n\n```\n%s\n```' "$(tail -n 40 informe.txt)")"
          exit 1
