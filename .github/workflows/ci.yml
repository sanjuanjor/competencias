name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Datos válidos y archivos generados al día
        run: python scripts/build_data.py --check
      - name: Tests de Python
        run: python -m unittest discover -s tests -v
      - name: Tests de JavaScript
        run: node --test tests/core.test.mjs
