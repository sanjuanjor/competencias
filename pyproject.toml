[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "competencias-espana-mcp"
version = "0.3.0"
description = "Servidor MCP con el reparto competencial entre administraciones públicas en España, referenciado al BOE."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastmcp>=2.0"]

[project.scripts]
competencias-mcp = "competencias_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp-server/competencias_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/competencias.json" = "competencias_mcp/datos/competencias.json"
"data/carreteras.json" = "competencias_mcp/datos/carreteras.json"
"data/verificacion_boe.json" = "competencias_mcp/datos/verificacion_boe.json"
"data/casos.json" = "competencias_mcp/datos/casos.json"
"data/servicios_municipales.json" = "competencias_mcp/datos/servicios_municipales.json"
"data/provincias.json" = "competencias_mcp/datos/provincias.json"
"data/municipios.json" = "competencias_mcp/datos/municipios.json"

[tool.hatch.build.targets.sdist]
include = ["mcp-server/competencias_mcp", "data", "README.md"]
